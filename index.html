                Tu negocio merece una web a la altura

            <p class="section-subtitle">
                Diseño adaptado a dispositivos móviles, optimizado para conversión
                y sin cuotas ocultas.
            </p>

        </div>


        <div class="about-grid">

            <div class="about-card">

                <div class="card-icon">
                    ⚡
                </div>

                <h3>
                    Entrega Rápida
                </h3>

                <p>
                    Tu sitio web listo y funcionando en tiempo récord

                </p>

            </div>


            <div class="about-card">

                <div class="card-icon">
                    📱
                </div>

                    Diseñado específicamente para verse perfecto

                Planes adaptados a tu negocio
            </h2>

        </div>


        <div class="pricing-grid">


            <!-- TARJETA 1: PLAN BÁSICO -->
            <div class="card">

                <div class="card-image-header">

                    <img src="images/hero-bar.jpg"
                         alt="Plan Carta Digital">

                    <span class="card-tag">
                        CARTA / MENÚ QR
                    </span>

                </div>


                <div class="card-body">

                    <h3>
                        Plan Carta / Menú QR

                    </p>


                    <div class="price-box">

                        <span style="text-decoration: line-through; color: var(--text-muted); font-size: 0.85rem;">
                            Antes: 350€

                        <div class="price-amount">

                            199€

                            <small style="font-size:0.8rem; font-weight:normal; color:var(--accent-orange);">

                    </div>


                    <ul class="features-list">

                        <li>
                            ✓ Menú o catálogo digital interactivo (1 página)

                        </li>

                        <li>
                            ✓ Botones de llamada directa, WhatsApp o email
                        </li>

                        <li>
                            ✓ Visualización rápida en teléfonos móviles
                        </li>

                    </ul>

                </div>


                <div class="card-footer">

                    <a href="#contacto" class="btn btn-secondary full-width">
                        Solicitar propuesta
                    </a>

                </div>

            </div>


            <!-- TARJETA 2: PLAN IMPULSO -->
            <div class="card pricing-card-featured">

                <div class="card-image-header">

                    <img src="images/comparativaFondo.jpg"
                         alt="Plan Web Corporativa">

                    <span class="card-tag tag-featured">
                        🔥 MÁS POPULAR
                    </span>

                </div>


                <div class="card-body">

                    <h3>
                        Plan Web Corporativa

                        La solución completa para pymes y profesionales

                    </p>


                    <div class="price-box">

                        <span style="text-decoration: line-through; color: var(--text-muted); font-size: 0.85rem;">
                            Antes: 600€
                        </span>

                        <div class="price-amount">

                            349€

                            <small style="font-size:0.8rem; font-weight:normal; color:var(--accent-orange);">

                        <li>
                            ✓ Integración de llamadas, formularios y WhatsApp
                        </li>

                        <li>
                            ✓ Optimización SEO para aparecer en Google
                        </li>

                    </ul>

                </div>


                <div class="card-footer">

                    <a href="#contacto" class="btn btn-primary full-width">
                        Solicitar propuesta
                    </a>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- COMPARATIVA EN DETALLE POR PLAN -->
<section id="comparativa" class="about-section comparativa-section-bg">

    <div class="container">

        <div class="about-header">

            <span class="pill">
                Detalle de Servicios
            </span>

            <h2 class="section-title">
                ¿Qué diferencia a cada plan?
            </h2>

            <p class="section-subtitle">
                Asegúrate de elegir el servicio exacto que necesita tu proyecto.
            </p>

        </div>


        <div class="plans-comparison-grid">


            <!-- APARTADO PLAN BÁSICO -->
            <div class="plan-detail-card">

                <div class="plan-detail-header">

                    <span class="plan-badge badge-basic">
                        PLAN BÁSICO
                    </span>

                    <h3>
                        Carta Digital / Menú QR
                    </h3>

                    <div class="plan-target">

                        🎯

                        <strong>
                            Ideal para:
                        </strong>

                        Bares, restaurantes, cafeterías o negocios
                        que solo buscan sustituir su carta física por un QR
                        o mostrar datos básicos de contacto.

                    </div>

                </div>


                <div class="plan-detail-body">

                    <ul class="check-list">

                        <li class="included">
                            <span>✓</span>
                            Carta/Menú digital interactivo de lectura rápida
                        </li>

                        <li class="included">
                            <span>✓</span>
                            Código QR generado listo para mesas o escaparates
                        </li>

                        <li class="included">
                            <span>✓</span>
                            Botones directos para llamar, escribir por email o WhatsApp
                        </li>

                        <li class="included">
                            <span>✓</span>
                            Carga ultrarrápida optimizada para teléfonos
                        </li>

                        <li class="excluded">
                            <span>✕</span>
                            No incluye secciones corporativas
                            (Servicios, Historia, Equipo)
                        </li>

                        <li class="excluded">
                            <span>✕</span>
                            No incluye SEO avanzado para posicionar
                            palabras clave en Google
                        </li>

                    </ul>

                </div>

            </div>


            <!-- APARTADO PLAN COMPLETO -->
            <div class="plan-detail-card featured-detail-card">

                <div class="plan-detail-header">

                    <span class="plan-badge badge-impulso">
                        PLAN COMPLETO
                    </span>

                    <h3>
                        Web Corporativa Impulso
                    </h3>

                    <div class="plan-target">

                        🎯

                        <strong>
                            Ideal para:
                        </strong>

                        Empresas, pymes, clínicas o profesionales
                        que necesitan transmitir confianza,
                        explicar todos sus servicios y captar
                        clientes en Google.

                    </div>

                </div>


                <div class="plan-detail-body">

                    <ul class="check-list">

                        <li class="included">
                            <span>✓</span>
                            Sitio web corporativo multisección completo
                        </li>

                        <li class="included">
                            <span>✓</span>
                            Módulos detallados de Servicios, Presentación y Contacto
                        </li>

                        <li class="included">
                            <span>✓</span>
                            Canales de contacto configurables
                            (Llamadas directas, formulario, WhatsApp, email)
                        </li>

                        <li class="included">
                            <span>✓</span>
                            Optimización SEO para aparecer en búsquedas de Google
                        </li>

                        <li class="included">
                            <span>✓</span>
                            Diseño 100% personalizado adaptado a tu identidad visual
                        </li>

                        <li class="included">
                            <span>✓</span>
                            Integración de mapa interactivo y ubicación de negocio
                        </li>

                    </ul>

                </div>

            </div>

        </div>

</section>


<!-- CONTACTO -->
<section id="contacto" class="contact-section">

    <div class="container">

        <h2 class="section-title">
            Solicita tu propuesta sin compromiso
        </h2>

        <p class="section-subtitle">
            Déjanos tus datos y te contactaremos en menos de 24 horas.
        </p>


        <form onsubmit="event.preventDefault(); alert('Formulario enviado correctamente');">

            <input
                type="text"
                placeholder="Tu Nombre"
                required
            >

            <input
                type="email"
                placeholder="Correo Electrónico"
                required
            >

            <input
                type="tel"
                placeholder="Teléfono / WhatsApp"
                required
            >

            <textarea
                rows="4"
                placeholder="Cuéntanos sobre tu proyecto">
            </textarea>

            <button
                type="submit"
                class="btn btn-primary full-width btn-lg">

                Enviar consulta

            </button>

        </form>

    </div>

</section>
