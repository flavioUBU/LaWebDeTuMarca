<svg xmlns="http://www.w3.org/2000/svg" viewBox="190 190 420 410" width="100%" height="100%">
  <defs>
    <!-- Gradiente Azul Neón -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Gradiente Naranja Neón -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Resplandor Neón para destacar sobre fondo oscuro -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Isotipo W (Sin fondo) -->
  <g filter="url(#glow)">
    <!-- Trazo Izquierdo Azul -->
    <path d="M 220 210 L 320 450 L 380 310" fill="none" stroke="url(#blueGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Diagonal Central -->
    <path d="M 380 310 L 440 450" fill="none" stroke="url(#blueGrad)" stroke-width="34" stroke-linecap="round" opacity="0.85" />

    <!-- Trazo Derecho Naranja Principal -->
    <path d="M 440 450 L 540 210" fill="none" stroke="url(#orangeGrad)" stroke-width="40" stroke-linecap="round" />

    <!-- Trazo Derecho Naranja Secundario -->
    <path d="M 500 450 L 580 260" fill="none" stroke="url(#orangeGrad)" stroke-width="20" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Texto Principal: LAWEBDE (Blanco puro) y TUMARCA (Naranja) -->
  <text x="400" y="540" text-anchor="middle" font-family="'Segoe UI', 'Montserrat', sans-serif" font-weight="900" font-size="48" letter-spacing="2.5" fill="#FFFFFF">
    LAWEBDE<tspan fill="#EA580C">TUMARCA</tspan>
  </text>
  
  <!-- Subtítulo en Gris Claro / Azulado -->
  <text x="400" y="585" text-anchor="middle" font-family="'Segoe UI', 'Montserrat', sans-serif" font-weight="600" font-size="19" letter-spacing="5" fill="#94A3B8">
    SOLUCIONES DIGITALES &amp; BRANDING
  </text>
</svg>
